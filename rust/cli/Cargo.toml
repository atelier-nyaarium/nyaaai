[package]
name = "nyaaai-cli"
description = "The nyaaai command line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "nyaaai"

[lints]
workspace = true

[features]
# The gate's build: `serve` also runs the case kinds.
cases = ["dep:nyaaai-testkit"]

[[bin]]
name = "nyaaai"
path = "src/main.rs"

[dependencies]
nyaaai-adapter.workspace = true
nyaaai-contract.workspace = true
nyaaai-operator.workspace = true
nyaaai-process.workspace = true
nyaaai-testkit = { workspace = true, optional = true }

[dev-dependencies]
nyaaai-testkit.workspace = true
