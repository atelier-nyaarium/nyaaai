disallowed-methods = [
    { path = "str::trim", reason = "use nyaaai_contract::text::trim_text" },
    { path = "str::trim_start", reason = "use nyaaai_contract::text::trim_text" },
    { path = "str::trim_end", reason = "use nyaaai_contract::text::trim_text" },
    { path = "str::to_lowercase", reason = "use nyaaai_contract::text::ascii_lower" },
    { path = "str::to_uppercase", reason = "use nyaaai_contract::text::ascii_upper" },
    { path = "str::split_whitespace", reason = "split on nyaaai_contract::text::is_space, not Unicode whitespace" },
    { path = "str::lines", reason = "split lines on explicit separators, as ECMAScript does" },
    { path = "char::is_whitespace", reason = "use nyaaai_contract::text::is_space" },
    { path = "f64::round", reason = "use nyaaai_contract::number::round_half_up" },
    { path = "f32::round", reason = "use nyaaai_contract::number::round_half_up" },
    { path = "f64::round_ties_even", reason = "use nyaaai_contract::number::round_half_up" },
    { path = "f32::round_ties_even", reason = "use nyaaai_contract::number::round_half_up" },
    { path = "char::to_lowercase", reason = "use nyaaai_contract::text::ascii_lower" },
    { path = "char::to_uppercase", reason = "use nyaaai_contract::text::ascii_upper" },
    { path = "str::split_ascii_whitespace", reason = "split on nyaaai_contract::text::is_space, which is ECMAScript's whitespace" },
    { path = "char::is_alphanumeric", reason = "use char::is_ascii_alphanumeric: patterns and names are ASCII" },
    { path = "char::is_alphabetic", reason = "use char::is_ascii_alphabetic: patterns and names are ASCII" },
    { path = "char::is_numeric", reason = "use char::is_ascii_digit: digits are ASCII" },
]
